name: Deploy PR Storybook preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Share group with main Pages deploy to avoid racing pushes to gh-pages
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@onlyzoran'

      - name: Install and build Storybook
        if: github.event.action != 'closed'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
          STORYBOOK_BASE: /win-predict-ai-ui/pr-preview/pr-${{ github.event.number }}/
        run: |
          npm ci
          npm run build-storybook
          touch storybook-static/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./storybook-static/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # Avoid failing the job when Pages briefly errors during concurrent updates
          wait-for-pages-deployment: false
