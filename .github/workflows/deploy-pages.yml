name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4

      # package-lock resolves icons via file:../win-predict-ai-icons
      - name: Checkout icons
        uses: actions/checkout@v4
        with:
          repository: onlyzoran/win-predict-ai-icons
          path: win-predict-ai-icons
          token: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

      - name: Link icons as sibling
        run: ln -sfn "${GITHUB_WORKSPACE}/win-predict-ai-icons" "${GITHUB_WORKSPACE}/../win-predict-ai-icons"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            win-predict-ai-icons/package-lock.json

      # file: link points at source repo — dist/ is gitignored, build it first
      - name: Build icons
        working-directory: win-predict-ai-icons
        run: |
          npm ci
          npm run build

      - run: npm ci

      - run: npm run build-storybook
        env:
          STORYBOOK_BASE: /win-predict-ai-ui/

      # Branch Pages runs Jekyll; Storybook assets must not be filtered
      - run: touch storybook-static/.nojekyll

      # clean + clean-exclude: only Storybook output, keep open PR previews
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview
