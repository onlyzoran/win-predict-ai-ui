name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@onlyzoran'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

      - run: npm run build-storybook
        env:
          STORYBOOK_BASE: /win-predict-ai-ui/

      # Branch Pages runs Jekyll; Storybook assets must not be filtered
      - run: touch storybook-static/.nojekyll

      # clean + clean-exclude: only Storybook output, keep open PR previews
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview
