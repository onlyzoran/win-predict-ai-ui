name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: win-predict-ai-ui
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          path: win-predict-ai-ui

      # package-lock resolves icons via file:../win-predict-ai-icons
      - name: Checkout icons
        uses: actions/checkout@v4
        with:
          repository: onlyzoran/win-predict-ai-icons
          path: win-predict-ai-icons
          token: ${{ secrets.NODE_AUTH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: win-predict-ai-ui/package-lock.json

      - run: npm ci

      - run: npm run build-storybook
        env:
          STORYBOOK_BASE: /win-predict-ai-ui/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: win-predict-ai-ui/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
