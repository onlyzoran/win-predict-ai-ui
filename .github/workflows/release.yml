name: Release package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

permissions:
  contents: write
  packages: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN pushes do not re-trigger workflows; still skip bot release commits on push.
    if: >
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # package-lock resolves icons via file:../win-predict-ai-icons
      - name: Checkout icons
        uses: actions/checkout@v4
        with:
          repository: onlyzoran/win-predict-ai-icons
          path: win-predict-ai-icons
          token: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

      - name: Link icons as sibling
        run: ln -sfn "${GITHUB_WORKSPACE}/win-predict-ai-icons" "${GITHUB_WORKSPACE}/../win-predict-ai-icons"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            win-predict-ai-icons/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@onlyzoran'

      - name: Build icons
        working-directory: win-predict-ai-icons
        run: |
          npm ci
          npm run build

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

      - name: Resolve bump type
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_BUMP: ${{ inputs.bump }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${INPUT_BUMP}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMIT_MSG" | grep -qiE '\[skip release\]|\[no release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMIT_MSG" | grep -qiE '\[major\]'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMIT_MSG" | grep -qiE '\[minor\]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMIT_MSG" | grep -qiE '\[patch\]'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RANGE=""
          if LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            RANGE="${LAST_TAG}...HEAD"
            echo "Comparing components since tag ${LAST_TAG}"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE_SHA}...HEAD"
            echo "Comparing components since previous main tip ${BEFORE_SHA}"
          else
            echo "No baseline for component diff; defaulting to patch"
            echo "type=patch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_COMPONENTS=$(git diff --name-only --diff-filter=A ${RANGE} \
            -- 'src/components/*.vue' ':(glob)src/components/**/*.vue' \
            | grep -v '/ui/dropdown-menu/' \
            || true)

          if [ -n "$NEW_COMPONENTS" ]; then
            echo "New components:"
            echo "$NEW_COMPONENTS"
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "No new public components since last release"
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip release
        if: steps.bump.outputs.skip == 'true'
        run: echo "Release skipped by commit message"

      - name: Configure git
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: steps.bump.outputs.skip != 'true'
        run: |
          npm version "${{ steps.bump.outputs.type }}" -m "chore(release): %s"

      - name: Publish to GitHub Packages
        if: steps.bump.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Push version commit and tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          git push
          git push --tags
